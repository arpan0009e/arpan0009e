name: Daily Profile Activity Update

on:
  schedule:
    - cron: "35 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update daily activity
        run: |
          TODAY=$(TZ=Asia/Kolkata date '+%d %B %Y')
          FILE="daily-activity.md"
          if ! grep -Fq -- "- $TODAY" "$FILE"; then
            printf '\n- %s: Profile maintenance workflow executed successfully.\n' "$TODAY" >> "$FILE"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "arpan0009e"
          git config user.email "arpanmondal708@gmail.com"
          git add daily-activity.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily profile activity update"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
